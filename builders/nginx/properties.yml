---
main_package: nginx-core
repository: nginx
# endoflife.date: mainline + stable at major.minor granularity
stream: "1.30"
summary: "High-performance HTTP and reverse proxy server"
description: >-
  nginx is a high-performance HTTP server, reverse proxy, and mail proxy
  server. This image is seeded from the Red Hat nginx FIPS runtime
  (registry.access.redhat.com/hi/nginx:latest-fips) with third-party
  dynamic modules (headers-more, ndk, set-misc, tcp-keepalive) compiled
  in a multi-stage build on latest-fips-builder.
url: "https://nginx.org"
reverse_dependency_tests: false
tags:
  - value: latest
  - value: '{{ package_major_minor_version("nginx-core") }}'
  - value: '{{ package_version("nginx-core") }}'
    label: org.opencontainers.image.version
# Runtime tools required by entrypoint.sh / setup.sh / libnginx.sh.
# Do not add gcc, make, git, or *-devel here — those stay in the builder.
rpm_packages:
  all:
    - coreutils-single
    - nginx-core
    - bash
    - sed
    - grep
    - gawk
    - findutils
    - openssl

---
main_package: bash
repository: snooze
# custom application, no upstream version branches
stream: "latest"
summary: "Minimal static HTTP server"
description: >-
  snooze is a tiny HTTP server that answers every request with a fixed
  message. It is compiled fully static in a build stage and runs on the
  Red Hat hummingbird static base (hi/static): CA certificates, timezone
  data, and a non-root user — no shell, libc, or package manager.
url: "https://github.com/technobureau/docker-builds"
reverse_dependency_tests: false
variants:
  - default
tags:
  - value: latest
rpm_packages:
  all: []

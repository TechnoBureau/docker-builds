---
main_package: redhat-release
repository: ubi10
# Pin distro so ci_hummingbird_distros() generates images/ubi10/ubi10/*
# instead of falling back to default_distros: [hummingbird] in
# builders/variables.yml (which pulled hummingbird.repo).
distros:
  - ubi10
# distro-tracking base image, no upstream version branches
stream: "latest"
summary: "Minimal UBI 10 base image (glibc + bash)"
description: >-
  Minimal base image built from UBI 10 (RHEL 10) BaseOS/AppStream: glibc, bash,
  and coreutils-single. Suitable as a foundation for applications that do
  not ship their own runtime. Includes the redhat-release package for
  repository identity.
url: "https://github.com/technobureau/docker-builds"
reverse_dependency_tests: false
variants:
  - default
tags:
  - value: latest
  - value: '{{ package_major_minor_version("redhat-release") }}'
    label: org.opencontainers.image.version
rpm_packages:
  all:
    - glibc
    - bash
    - coreutils-single
    - redhat-release
    # Required by STIG (package_crypto-policies_installed,
    # configure_crypto_policy); install sets the DEFAULT system crypto policy.
    - crypto-policies
    - openssl-libs
    - openssl-fips-provider
    - openssl-fips-provider-so

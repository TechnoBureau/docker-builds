---
main_package: bash
repository: ubi9
# distro-tracking base image, no upstream version branches
stream: "latest"
summary: "Minimal hummingbird core runtime base image (glibc + bash)"
description: >-
  Minimal base image built with the hummingbird core runtime: glibc, bash,
  and coreutils-single. Suitable as a foundation for applications that do
  not ship their own runtime. Includes the hummingbird release package for
  repository identity.
url: "https://github.com/technobureau/containers"
reverse_dependency_tests: false
variants:
  - default
tags:
  - value: latest
rpm_packages:
  all:
    - glibc
    - bash
    - coreutils-single
    - hummingbird-release

# Shared build configuration for all hummingbird builders.
# Per-image files (builders/<image>/variables.yml) are deep-merged over
# these defaults for additional/override values. Env overrides
# (HB_*, SKIP_PUSH, PLATFORMS, REGISTRY) win.
default_user: "65532"
default_distros:
  - hummingbird
default_variants:
  - default
#  - builder
default_rpm_packages:
  all:
    - crypto-policies-config-fips
    - openssl-config-fips
  builder:
    - bash
    - dnf5
    - shadow-utils
variant_descriptions:
  default: "Standard production image"
platforms:
  - linux/amd64
  - linux/arm64
default_variant_repos:
  hummingbird:
    - hummingbird.repo
  ubi9:
    - ubi9.repo
  ubi10:
    - ubi10.repo
oscap:
  enabled: true
  # Per-distro SCAP datastreams used by verify-compliance in the builder stage.
  # A distro listed here runs oscap verification with its datastream; the
  # datastream file must be present in the hummingbird-builder image.
  datastreams:
    hummingbird: ssg-hummingbird-ds.xml
    ubi9: ssg-rhel9-ds.xml
    ubi10: ssg-rhel10-ds.xml
  profiles:
    cis: true
    stig:
      variants:
        - "*"
  exclude_rules:
    - id: xccdf_org.ssgproject.content_rule_root_path_no_dot
      reason: "False positive: environmentvariable58 probe requires /proc which is unavailable in offline chroot scanning"
registry: ghcr.io/technobureau
labels:
  maintainer: "Ganapathi Chidambaram"
  vendor: "Technobureau"
  source_url: "https://github.com/technobureau/docker-builds"
